<div class="card p-4 shadow-sm">
  <h2 class="mb-3">Add Book</h2>

  <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" formControlName="title" class="form-control" [ngClass]="{'is-invalid': bookForm.get('title')?.invalid && bookForm.get('title')?.touched}">
      <div class="invalid-feedback" *ngIf="bookForm.get('title')?.invalid && bookForm.get('title')?.touched">
        Title is required.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Author</label>
      <input type="text" formControlName="author" class="form-control" [ngClass]="{'is-invalid': bookForm.get('author')?.invalid && bookForm.get('author')?.touched}">
      <div class="invalid-feedback" *ngIf="bookForm.get('author')?.invalid && bookForm.get('author')?.touched">
        Author is required.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Published Date</label>
      <input type="date" formControlName="publishedDate" class="form-control" [ngClass]="{'is-invalid': bookForm.get('publishedDate')?.invalid && bookForm.get('publishedDate')?.touched}">
      <div class="invalid-feedback" *ngIf="bookForm.get('publishedDate')?.invalid && bookForm.get('publishedDate')?.touched">
        Date is required.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea formControlName="description" rows="5" class="form-control" [ngClass]="{'is-invalid': bookForm.get('description')?.invalid && bookForm.get('description')?.touched}"></textarea>
      <div class="invalid-feedback" *ngIf="bookForm.get('description')?.invalid && bookForm.get('description')?.touched">
        Description is required.
      </div>
    </div>

    <button class="btn btn-success w-100" type="submit" [disabled]="bookForm.invalid">
      <i class="bi bi-plus-circle"></i> Add Book
    </button>
  </form>
</div>
