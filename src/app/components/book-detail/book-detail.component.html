<div class="card p-4 shadow-sm">
  <h2 class="mb-3">{{ book?.title }}</h2>
  <p><strong>Author:</strong> {{ book?.author }}</p>
  <p><strong>Published:</strong> {{ book?.publishedDate }}</p>
  <p class="mt-3">{{ book?.description }}</p>
</div>

<div class="mt-4 d-flex justify-content-end gap-2">
  <button class="btn btn-primary" [routerLink]="['/books', book?.id, 'edit']">
    <i class="bi bi-pencil"></i> Edit
  </button>
  <button class="btn btn-danger" (click)="onDelete()">
    <i class="bi bi-trash"></i> Delete
  </button>
</div>

<p><strong>Status:</strong>
  <span [ngClass]="book?.checkedOut ? 'text-danger' : 'text-success'">
    {{ book?.checkedOut ? 'Checked Out' : 'Available' }}
  </span>
</p>

<button class="btn btn-outline-warning mt-3" (click)="toggleCheckOut()">
  {{ book?.checkedOut ? 'Return Book' : 'Check Out Book' }}
</button>
