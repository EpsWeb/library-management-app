<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Books</h2>
  <button class="btn btn-success" (click)="addBook()">
    <i class="bi bi-plus-lg"></i> Add Book
  </button>
</div>

<div class="mb-3">
  <app-search-bar (search)="applyFilter($event)"></app-search-bar>
</div>

<div class="d-flex gap-2 mb-3 align-items-center">
  <strong class="me-2">Sort by:</strong>
  <button class="btn btn-outline-secondary btn-sm" (click)="setSort('title')">Title</button>
  <button class="btn btn-outline-secondary btn-sm" (click)="setSort('author')">Author</button>
  <button class="btn btn-outline-secondary btn-sm" (click)="setSort('publishedDate')">Date</button>
</div>

<div *ngIf="pagedBooks.length > 0; else noBooks">
  <div class="card mb-3 shadow-sm" *ngFor="let book of pagedBooks" (click)="viewBook(book.id)" style="cursor: pointer;">
    <div class="card-body">
      <h5 class="card-title mb-1">{{ book.title }}
        <span class="badge bg-secondary float-end" *ngIf="book.checkedOut">Checked Out</span>
      </h5>
      <p class="card-subtitle text-muted mb-1">{{ book.author }}</p>
      <p class="card-text"><small>Published: {{ book.publishedDate }}</small></p>
    </div>
  </div>

  <nav class="mt-4">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="changePage(-1)">Previous</button>
      </li>
      <li class="page-item disabled">
        <span class="page-link">Page {{ currentPage }} of {{ totalPages() }}</span>
      </li>
      <li class="page-item" [class.disabled]="currentPage >= totalPages()">
        <button class="page-link" (click)="changePage(1)">Next</button>
      </li>
    </ul>
  </nav>
</div>

<ng-template #noBooks>
  <div class="alert alert-warning">No books found.</div>
</ng-template>
